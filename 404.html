<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/media/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light" />
		<meta name="robots" content="noindex" />
		<title>404 · Portfolio 1.0.2</title>
		<link rel="stylesheet" href="/src/react-app/index.css" />
	</head>

	<!-- Served by Cloudflare for unknown paths (not_found_handling: "404-page" in wrangler.json). -->
	<body class="bg-base font-mono text-sm leading-relaxed text-fg selection:bg-highlight sm:text-[15px]">
		<div class="flex min-h-screen flex-col gap-5 px-4 py-4 sm:px-8 sm:py-6">
			<h1 class="font-bold">Portfolio 1.0.2</h1>

			<section>
				<p class="break-words">
					<span class="font-bold text-iris">user@mlacae</span>:<span class="font-bold text-pine">~</span>$ cd <span id="path">that-page</span>
				</p>
				<p class="mt-1 break-words text-love">bash: cd: <span id="error-path">that-page</span>: No such file or directory</p>
			</section>

			<section>
				<p class="break-words">
					<span class="font-bold text-iris">user@mlacae</span>:<span class="font-bold text-pine">~</span>$ cd
					<a
						href="/"
						class="inline-flex max-w-full items-center gap-[0.5ch] rounded border border-highlight px-[1ch] text-pine transition-colors hover:border-pine hover:bg-overlay focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pine"
					>
						~<span aria-hidden class="ml-auto pl-[0.5ch]">↗</span>
					</a>
					<span aria-hidden class="inline-block h-[1.1em] w-[0.6em] animate-blink bg-fg align-text-bottom motion-reduce:animate-none"></span>
				</p>
			</section>
		</div>

		<script type="module">
			// Show the path that was requested; the static text above is the no-JS fallback.
			for (const id of ['path', 'error-path']) document.getElementById(id).textContent = location.pathname
		</script>
	</body>
</html>
